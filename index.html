<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Allesia — немного несерьёзно</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f0e7;color:#22231e;font-family:Arial,sans-serif;min-height:100svh;overflow-x:hidden}header{display:flex;justify-content:space-between;padding:28px 5vw;border-bottom:1px solid #2223;font-size:12px;font-weight:700;letter-spacing:2px}.dot{display:inline-block;width:9px;height:9px;background:#ff6335;border-radius:50%;margin-right:9px}main{text-align:center;padding:70px 20px 35px}.eyebrow{font-size:12px;letter-spacing:3px;text-transform:uppercase}.tag{display:inline-block;background:#e5ff54;border:1px solid #222;padding:8px 15px;transform:rotate(-6deg);font-size:14px;margin:20px 0}h1{display:flex;justify-content:center;margin:35px 0 20px;font-size:clamp(64px,17vw,230px);letter-spacing:-.075em;line-height:1.3;font-weight:900}h1 button{font:inherit;letter-spacing:inherit;color:inherit;padding:0;border:0;background:none;position:relative;cursor:pointer;animation:dance 1.6s infinite alternate ease-in-out;animation-delay:calc(var(--i)*-.22s);transform-origin:50% 90%}h1 button:nth-child(2n){color:#ff6335}h1 button:nth-child(3n){color:#8580ed}.eyes{display:flex;gap:3px;position:absolute;top:33%;left:40%;letter-spacing:0}.eyes i{background:white;border:1px solid #222;width:clamp(9px,1.7vw,23px);height:clamp(12px,2.2vw,29px);border-radius:50%;display:grid;place-items:center}.eyes i:after{content:'';width:40%;height:45%;background:#222;border-radius:50%;transform:translate(1px,2px)}.caption{min-height:48px;font-size:18px;color:#58594f}.controls{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin:32px 0}.controls button{border:1px solid #222;background:transparent;border-radius:50px;padding:16px 24px;font-size:14px;cursor:pointer;box-shadow:3px 3px 0 #222;transition:transform .15s,box-shadow .15s}.controls button:hover{transform:translate(-2px,-2px);box-shadow:5px 5px 0 #222}.controls button:first-child{background:#e5ff54}.controls button:last-child{background:#ff6335;color:#fff}.note{font-size:12px;color:#737469;margin-top:28px}footer{display:flex;justify-content:space-between;margin:55px 5vw 20px;border-top:1px solid #2223;padding-top:20px;font-size:11px;letter-spacing:1px}.confetti{position:fixed;top:-40px;pointer-events:none;font-size:28px;animation:fall 2.5s linear forwards;z-index:4}.drama h1 button{animation:drama .65s infinite alternate}.drama{background:#211c35;color:#f4f0e7}.drama .caption,.drama .note{color:#d8d0e8}.drama .controls button{border-color:#f4f0e7;color:#222}.drama .controls button:nth-child(2){color:#fff}.paused h1 button{animation-play-state:paused}button:focus-visible{outline:3px dashed #8580ed;outline-offset:7px}@keyframes dance{from{transform:rotate(-9deg) translateY(5px) scaleY(.92)}to{transform:rotate(8deg) translateY(-22px) scaleY(1.08)}}@keyframes drama{to{transform:rotate(13deg) translateY(-35px)}}@keyframes fall{to{transform:translate(var(--drift),110vh) rotate(600deg)}}@media(max-width:550px){main{padding-top:50px}header{font-size:9px;letter-spacing:1px}.caption{font-size:15px}footer{font-size:9px}h1{margin-top:50px;margin-bottom:35px}}@media(prefers-reduced-motion:reduce){h1 button,.drama h1 button{animation:none}.confetti{display:none}}
</style>
</head>
<body>
<header><span><span class="dot"></span>СТУДИЯ ХОРОШЕГО НАСТРОЕНИЯ</span><span>VOL. 01 / ALLESIA</span></header>
<main><p class="eyebrow">Серьёзность покинула чат</p><span class="tag">100% имя. 0% самоконтроля.</span>
<h1 aria-label="Allesia"></h1>
<p class="caption" aria-live="polite">Просто Allesia. Просто танцует. Вопросы?</p>
<div class="controls"><button id="party">Добавить хаоса ↗</button><button id="drama" aria-pressed="false">Режим «драма» 🎭</button><button id="forbidden">Не нажимать 👀</button></div>
<button id="pause" style="border:0;background:transparent;color:inherit;cursor:pointer;text-decoration:underline" aria-pressed="false">Поставить танцы на паузу</button>
<p class="note">P.S. Буквы щекотные. Попробуй нажать на любую.</p></main>
<footer><span>СДЕЛАНО С УЛЫБКОЙ ✳</span><span>НИ ОДНА БУКВА НЕ ПОСТРАДАЛА*</span></footer>
<script>
const title=document.querySelector('h1'),caption=document.querySelector('.caption');
const jokes=['У буквы A сегодня ноги от ушей.','Две l — это не опечатка. Это подтанцовка.','e опять забыла хореографию.','s делает вид, что так и задумано.','i пришла на вечеринку со своей точкой.','Последняя a: «Я с ними впервые».'];
function rain(){if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;for(let i=0;i<32;i++){const p=document.createElement('span');p.className='confetti';p.textContent=['✦','●','★','🥔','✨'][i%5];p.style.cssText=`left:${Math.random()*100}vw;color:${['#ff6335','#8580ed','#c7df24'][i%3]};--drift:${Math.random()*200-100}px;animation-delay:${Math.random()*.4}s`;document.body.append(p);p.addEventListener('animationend',()=>p.remove());}}
[...'Allesia'].forEach((letter,i)=>{const b=document.createElement('button');b.style.setProperty('--i',i);b.setAttribute('aria-label','Пощекотать букву '+letter);b.append(document.createTextNode(letter));const eyes=document.createElement('span');eyes.className='eyes';eyes.setAttribute('aria-hidden','true');eyes.innerHTML='<i></i><i></i>';b.append(eyes);b.onclick=()=>{caption.textContent=jokes[i%jokes.length];rain()};title.append(b)});
let chaos=0;document.querySelector('#party').onclick=()=>{caption.textContent=['Allesia.exe перестала быть серьёзной.','Уровень хаоса: картошка на дискотеке 🥔','Мама, я теперь шрифт с характером!','Осторожно: настроение вышло из-под контроля.'][chaos++%4];rain()};
document.querySelector('#drama').onclick=e=>{const active=document.body.classList.toggle('drama');e.currentTarget.setAttribute('aria-pressed',active);caption.textContent=active?'Она просто попросила чай. Но КАК она попросила…':'Драма отменяется. Печеньки нашлись.'};
document.querySelector('#forbidden').onclick=()=>{caption.textContent='Ну всё. Теперь ты официально менеджер по танцам Allesia. 🪩';rain()};
document.querySelector('#pause').onclick=e=>{const paused=document.body.classList.toggle('paused');e.currentTarget.setAttribute('aria-pressed',paused);e.currentTarget.textContent=paused?'Продолжить танцы':'Поставить танцы на паузу'};
</script>
</body></html>
